<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockPredict - Chi tiết mã</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="symbol">
  <header class="site-header"><a href="/" class="brand">← StockPredict MVP</a><span id="market-status">Đang kiểm tra thị trường…</span></header>
  <main class="single-column panel">
    <div class="heading-row"><div><h1 id="current-symbol">Đang tải…</h1><p>Dữ liệu OHLCV từ SQLite qua REST API</p></div><a id="dashboard-link" href="/">Về dashboard</a></div>
    <p id="ohlcv-status" class="status" aria-live="polite">Đang tải dữ liệu…</p>
    <div id="chart" class="chart" role="img" aria-label="Biểu đồ đường giá đóng cửa"></div>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Volume</th><th>Symbol</th></tr></thead><tbody id="ohlcv-table"></tbody></table></div>
  </main>
  <script src="/assets/js/app.js"></script>
</body>
</html>
